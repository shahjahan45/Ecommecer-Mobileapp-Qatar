name: ecommerce_mobile
version: 1.19.4+64
publish_to: 'none'

description: Cumulative DCX Online Store Phase 19.1.1 hotfix with Firebase customer identity, real-time storefront, corrected search discovery compilation, and all previous commerce and operations features.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_maps_flutter: 2.12.3
  geocoding: ^5.0.0
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
