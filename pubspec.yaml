name: ecommerce_mobile
version: 1.12.0+42
publish_to: 'none'

description: Cumulative DCX Online Store Phase 12 with a professional promotions and savings engine, promo-code UX across cart and checkout, persistent adaptive themes, the complete premium launch experience and all previous commerce features.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
