name: ecommerce_mobile
version: 1.15.1+49
publish_to: 'none'

description: Cumulative DCX Online Store Phase 15.1 with geocoding 5.x API compatibility, premium saved addresses, optional Google Maps location selection, refined Profile/Home footer experiences, secure checkout, notifications, support, promotions, adaptive themes and all previous commerce features.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_maps_flutter: 2.12.3
  geocoding: ^5.0.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
