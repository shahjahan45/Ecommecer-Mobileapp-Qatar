name: ecommerce_mobile
version: 1.8.6+25
publish_to: 'none'

description: Cumulative DCX Online Store Phase 8.1 with stable product-detail navigation, professional color swatches, orders and tracking, synchronized cart and checkout, wishlist, authentication, and official branding.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
