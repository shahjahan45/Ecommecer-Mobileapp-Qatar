name: ecommerce_mobile
version: 1.6.2+12
publish_to: 'none'

description: Cumulative DCX Online Store Phase 6.1.1 with premium Product Details UI, synchronized Wishlist, and responsive-safe short-screen fixes.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
